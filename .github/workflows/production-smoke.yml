name: Production Smoke Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production base URL
        required: false
        default: https://profesja-premium-limited.vercel.app
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ inputs.base_url || 'https://profesja-premium-limited.vercel.app' }}
    steps:
      - name: Show target
        run: echo "Testing ${BASE_URL}"
      - name: Check home page
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "${BASE_URL}/" >/dev/null
      - name: Check catalog
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "${BASE_URL}/catalog" >/dev/null
      - name: Check offer form
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "${BASE_URL}/offers/new" >/dev/null
      - name: Check client dashboard
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "${BASE_URL}/dashboard" >/dev/null
      - name: Check application and database readiness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 20 "${BASE_URL}/api/health"
