name: Migration Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: profesja
          POSTGRES_PASSWORD: profesja
          POSTGRES_DB: profesja_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U profesja -d profesja_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://profesja:profesja@localhost:5432/profesja_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Deploy migrations on fresh PostgreSQL
        run: npx prisma migrate deploy
      - name: Validate migration status
        run: npx prisma migrate status
      - name: Verify Prisma client generation
        run: npx prisma generate
