name: Apply Market Benchmarks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-market-benchmarks.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply benchmark snapshot
        run: node scripts/apply-market-benchmarks.mjs
      - name: Commit benchmark update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/HierarchicalCatalog.tsx
          if git diff --cached --quiet; then
            echo "No benchmark changes to commit"
          else
            git commit -m "Update catalog market benchmarks 2026-08-08"
            git push
          fi
